# Benchmark tasks. One entry per target repo, pinned to a commit that uses the old version.
# install:   installs the repo with its OWN dependencies (repo is the cwd). Editable (-e), so
#            tracebacks point into the repo, not site-packages. The agent controls these deps.
# test_deps: test tools and era pins (versions the repo was written against, so the baseline
#            passes). Installed separately AFTER the repo: when the agent correctly bumps a
#            dependency, a harness pin must never make its install fail (it did, see
#            fastapi-restful, and the agent hand-rolled BaseSettings to dodge the conflict).
# upgrade: pip requirement(s) forced on top to simulate the upgrade. Move companion packages
#          only as far as the new version requires, so the task stays about this library.
#
# A task is only valid if its baseline passes on the old version and its tests use the
# library through its public API: the agent may not edit tests, so tests that depend on
# old-version internals make the task impossible.
#
# Run one with:  uv run --env-file .env python -m agent.loop --task <id>

tasks:
  - id: geojson-pydantic
    difficulty: easy
    repo: https://github.com/developmentseed/geojson-pydantic
    commit: 8a07ab86373fb289c6a4ce34c2105a777debe380  # tag 0.6.3, pins pydantic~=1.0
    library: pydantic
    old_version: "1"
    new_version: "2"
    # shapely 2.0.x: the tests compare WKT strings, and 2.1+ (newer GEOS) and 1.x format them differently.
    install: pip install -e .
    test_deps: pytest "shapely>=2.0,<2.1"
    upgrade: pydantic>=2,<3
    test: pytest tests
    baseline: 134 passed on pydantic 1.10
    reference_solution: https://github.com/developmentseed/geojson-pydantic/pull/130  # upstream native v2 port

  - id: fastapi-restful
    difficulty: medium
    repo: https://github.com/yuval9313/FastApi-RESTful
    commit: 9ca60cb63e38551d54c74acd69f7469f5e9519a1  # pins pydantic ^1.0,<2.0, fastapi >=0.89,<1.0
    library: pydantic
    old_version: "1"
    new_version: "2"
    # fastapi<0.100: newer releases changed request-scoped dependency cleanup (7 unrelated failures).
    # Old httpx / pytest / pytest-asyncio: newer releases broke APIs the old test client relies on.
    install: pip install -e ".[session]"
    test_deps: '"fastapi>=0.89,<0.100" "pytest>=7,<8" "pytest-asyncio<0.24" "httpx<0.28" aiofiles'
    # Pydantic v2 needs FastAPI >=0.100; stay below 0.104 so later FastAPI changes aren't part of the task.
    # BaseSettings moved to pydantic-settings: adding that dependency is part of the agent's job.
    upgrade: pydantic>=2,<3 fastapi>=0.100,<0.104
    test: pytest tests
    baseline: 69 passed on pydantic 1.10 + fastapi 0.99
    reference_solution: https://github.com/yuval9313/FastApi-RESTful/pull/199  # keeps a v1 branch too

  - id: pydantic-cli
    difficulty: hard
    repo: https://github.com/mpkocher/pydantic-cli
    commit: d67ab8b265fd9ed045d27ecd904a04b8185481fa  # REQUIREMENTS.txt pins pydantic >=1.5,<2
    library: pydantic
    old_version: "1"
    new_version: "2"
    # shtab: optional dependency; without it 2 tests are skipped.
    install: pip install -e .
    test_deps: '"pytest>=7,<8" shtab'
    upgrade: pydantic>=2,<3
    test: pytest pydantic_cli/tests
    baseline: 35 passed on pydantic 1.10
    # Upstream changed CLI boolean-flag behaviour in its v2 port and rewrote those tests, so there is
    # no drop-in reference for them: the agent must keep v1 CLI behaviour on top of v2 introspection.
    reference_solution: https://github.com/mpkocher/pydantic-cli/pull/58

  - id: pyonwater
    difficulty: easy
    repo: https://github.com/kdeyev/pyonwater
    commit: 5f6301fb6cc9bf2c615a7f7bd9e16d1d75bc4e4b  # pins pydantic <2
    library: pydantic
    old_version: "1"
    new_version: "2"
    # No import errors: under v2 the code loads, but Optional fields without defaults become required,
    # so the API sample data stops validating (behaviour change, not a crash).
    install: pip install -e .
    # The tests use the `loop` fixture, which pytest-aiohttp 1.0 removed; pytest-asyncio clashes with it.
    test_deps: '"pytest>=7,<8" "pytest-aiohttp<1"'
    upgrade: pydantic>=2,<3
    test: pytest tests
    baseline: 25 passed on pydantic 1.10 (v2 unchanged - 10 passed, 15 ValidationError)
    reference_solution: https://github.com/kdeyev/pyonwater/pull/26

  - id: pydantic-sqlite
    difficulty: medium
    repo: https://github.com/Phil997/pydantic-sqlite
    commit: cb66bf28b47f4b50461a0c76c4fcb7bb2da2e86a  # 0.2.2, pins pydantic ^1.8.2
    library: pydantic
    old_version: "1"
    new_version: "2"
    # Library introspects v1 fields (ModelField, __fields__, .type_) to map models onto SQLite.
    install: pip install -e .
    test_deps: '"pytest>=7,<8" hypothesis testfixtures'
    upgrade: pydantic>=2,<3
    test: pytest tests
    baseline: 30 passed on pydantic 1.10 (v2 unchanged - every test module fails to import ModelField)
    # Upstream also changed a test model's Union order; a hypothesis test may need care under v2's smart unions.
    reference_solution: https://github.com/Phil997/pydantic-sqlite/pull/16

  - id: dbt-cloud-cli
    difficulty: medium
    repo: https://github.com/data-mie/dbt-cloud-cli
    commit: cb2680d353727f895b958fd8c5a8fec7657962b6  # 0.8.2+1, pins pydantic==1.10.10
    library: pydantic
    old_version: "1"
    new_version: "2"
    # Builds click options from v1 field internals (__fields__, .type_, .outer_type_, field_info.extra).
    install: pip install -e ".[test]"
    test_deps: '"pytest>=7,<8" requests-mock'
    upgrade: pydantic>=2,<3
    # DBT_CLOUD_ACCOUNT_ID: set by the repo's tox.ini; test_cli.py calls the real dbt Cloud API.
    test: DBT_CLOUD_ACCOUNT_ID=123456 pytest tests --ignore=tests/test_cli.py
    baseline: 31 passed on pydantic 1.10 (v2 unchanged - startup error, v1 validator signature)
    reference_solution: https://github.com/data-mie/dbt-cloud-cli/pull/108

  - id: gto
    difficulty: hard
    repo: https://github.com/iterative/gto
    commit: 5f141e4b649788cec87c76bca38893b2afd47030  # setup.py pins pydantic>=1.9.0,<2
    library: pydantic
    old_version: "1"
    new_version: "2"
    # BaseSettings with custom settings sources (pydantic.env_settings), parse_obj_as, Optional fields.
    install: pip install -e ".[tests]"
    # Era pins for the git stack the tests drive: newer typer drops click, click 8.2 changed CliRunner,
    # dulwich 0.22 removed Repo.stage, pygit2 1.15 removed GIT_OBJ_COMMIT. pytest<8 for pytest-lazy-fixture.
    test_deps: '"pytest>=7,<8" "typer<0.10" "click<8.2" "dulwich<0.22" "pygit2<1.15"'
    upgrade: pydantic>=2,<3
    test: pytest tests -k "not remote"  # "remote" tests clone from github.com
    baseline: 141 passed on pydantic 1.10 (v2 unchanged - startup error, BaseSettings moved)
    # Upstream's native port (PR #485) renamed config attributes TYPES -> types in tests; the agent must
    # keep the original names, so there's no drop-in reference for that part.
    reference_solution: https://github.com/iterative/gto/pull/485

  - id: copier
    difficulty: hard
    repo: https://github.com/copier-org/copier
    commit: 3a76e6645ab5d3a1c36684f8ceefd77c4fd4c6a5  # v8.1.0+4, pins pydantic >=1.10.2,<2
    library: pydantic
    old_version: "1"
    new_version: "2"
    # Imports pydantic v1 internals (errors._PathValueError, validators, typing, json) and uses
    # pydantic dataclasses throughout.
    install: pip install -e .
    # pyyaml-include 2 renamed its module; pathspec 0.12 deprecation warnings are errors in this suite.
    test_deps: '"pytest>=7,<8" pytest-cov pytest-xdist pexpect plumbum poethepoet "pyyaml-include<2" "pathspec<0.12"'
    upgrade: pydantic>=2,<3
    # -n 2: the suite's own config runs one xdist worker per host CPU, which ran out of memory (2 GB).
    # test_types runs mypy (a lint step, not behaviour); "impure" tests use the network.
    test: pytest -m "not impure" -n 2 tests --deselect tests/test_tools.py::test_types
    # The suite alone takes ~8 minutes; with installs on a slow network one run exceeded the default.
    timeout_seconds: 1500
    baseline: 691 passed, 5 skipped on pydantic 1.10 (v2 unchanged - startup error, _PathValueError removed)
    # Upstream PR #1229 changed 2 tests (a TypeError -> ValidationError, an int -> "2" in a fixture), so those
    # two may need library-side compatibility work to pass unchanged.
    reference_solution: https://github.com/copier-org/copier/pull/1229

# Rejected tasks, kept so they aren't re-evaluated.

  # ---------- SQLAlchemy 1.4 -> 2.0 ----------
  # upgrade is capped at <2.1: the task (and the docs the agent searches) is the 2.0 migration;
  # 2.1's own changes would make it a different task.

  - id: dataset
    difficulty: medium
    repo: https://github.com/pudo/dataset
    commit: b2ab09e58c6f17334e4286009b20887b6a8a8fac  # 1.6.2+, pins sqlalchemy>=1.3.2,<2.0.0
    library: sqlalchemy
    old_version: "1.4"
    new_version: "2.0"
    install: pip install -e .
    # alembic 1.13 supports both 1.4 and 2.0, so it doesn't have to move with SQLAlchemy.
    test_deps: pytest "alembic~=1.13"
    upgrade: sqlalchemy>=2.0,<2.1
    # The two shorthand tests call Table.exists() (removed in 2.0) from the test itself, so they
    # can never pass without editing tests; they are deselected rather than left as impossible.
    test: >-
      pytest test
      --deselect test/test_dataset.py::TableTestCase::test_create_table_shorthand1
      --deselect test/test_dataset.py::TableTestCase::test_create_table_shorthand2
    baseline: 59 passed on sqlalchemy 1.4; 0/59 on 2.0.58 (bound MetaData, engine.execute, select([...]))
    reference_solution: https://github.com/pudo/dataset/pull/443  # also restructures the tests; use source changes only

  - id: rdflib-sqlalchemy
    difficulty: medium
    repo: https://github.com/RDFLib/rdflib-sqlalchemy
    commit: 912ad4a129890dc583b064de14fc3bec4b7f0d87  # 0.5.4+, pins SQLAlchemy>=1.1.4,<2.0.0
    library: sqlalchemy
    old_version: "1.4"
    new_version: "2.0"
    install: pip install -e .
    test_deps: pytest six "rdflib==7.0.*" "alembic~=1.13"
    upgrade: sqlalchemy>=2.0,<2.1
    # DB=sqlite enables the SQLite graph/context suites; the MySQL/Postgres ones skip themselves (4 skipped).
    test: env DB=sqlite pytest test
    baseline: 44 passed, 4 skipped on sqlalchemy 1.4; 30 fail on 2.0.58 (select([...]), positional select()/delete() args)
    reference_solution: https://github.com/RDFLib/rdflib-sqlalchemy/commit/f058390

  - id: agate-sql
    difficulty: easy
    repo: https://github.com/wireservice/agate-sql
    commit: 98c5817b1cc8c15d75e59279f62a30383cf1b45a  # 0.5.9+, pins sqlalchemy<2
    library: sqlalchemy
    old_version: "1.4"
    new_version: "2.0"
    install: pip install -e .
    # crate 0.34 still bundles its SQLAlchemy dialect (used only to compile CREATE TABLE) and works on 1.4 and 2.0.
    test_deps: pytest geojson "crate==0.34.*" "agate~=1.7.1"
    upgrade: sqlalchemy>=2.0,<2.1
    test: pytest
    baseline: 18 passed on sqlalchemy 1.4; 9 fail on 2.0.58 (MetaData(connection), autoload, select([...]))
    reference_solution: https://github.com/wireservice/agate-sql/pull/40  # table.py only, tests untouched

  - id: coilmq
    difficulty: easy
    repo: https://github.com/coilmq/coilmq
    commit: b1d407ddb6586acbc95cb2f0915e241fc09d7752  # pins sqlalchemy<2 in the sqlalchemy extra; never migrated upstream
    library: sqlalchemy
    old_version: "1.4"
    new_version: "2.0"
    install: pip install -e .[sqlalchemy]
    # typing_extensions: the functional tests import it without declaring it (SQLAlchemy 2.0 happens to pull it in).
    test_deps: pytest pytest-cov fakeredis typing_extensions
    upgrade: sqlalchemy>=2.0,<2.1
    test: pytest
    baseline: 201 passed, 3 skipped on sqlalchemy 1.4; 34 errors on 2.0.58 (bound MetaData, select([...]), Row[Column])

rejected:
  - id: pydantic-argparse
    repo: https://github.com/SupImDos/pydantic-argparse
    commit: c07199879040f9cfd26f13b2cfbeb8105a3c830f  # tag v0.8.0
    reason: >-
      Tests depend on Pydantic v1 internals (tests/conftest.py uses pydantic.fields.ModelField.infer
      and pydantic.BaseSettings; test_parser.py uses __fields__, outer_type_, field_info), so the suite
      cannot pass under v2 without editing tests. Upstream only moved to the pydantic.v1 shim.
